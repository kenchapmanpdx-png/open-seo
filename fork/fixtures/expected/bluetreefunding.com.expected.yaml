# Golden expectations derived from fork/fixtures/audits/bluetreefunding-2026-11-15.md (read-only source; M3, B8 R3).
# urls: paths relative to origin; `*` = any segment. items: registry ids (src/server/features/handbook/registry.ts).
# detectableBy: deterministic (raw fetch/headers/robots/JSON-LD) | render (sidecar: JS on/off, screenshot, Lighthouse, axe) | llm | data (third-party account data) | owner.
# class: registry class of the primary item. severity: the golden audit's severity. note: scorer hints (site-changed, scope).
# supp: supplementary rule ids (src/server/features/handbook/registry-supp.ts, ADR-020); matched against report
# findings + additionalFindings like items. A SUPP-only entry has items: [].
# scope: entry excluded from the catch rate (golden-score verdict `excluded`): "outside-scope [Ken]" (FULL-READ §0/§6:
# not rankings/SEO/GEO, incl. the dropped sensitive-forms / SPF-DMARC / author-archive / generator-meta items) ·
# "truth-verification [Ken]" (checking a claim against an external source) · "off-site" (backlink / ranking data, EP-7).
# The golden F10 is split: F10 (lab LCP, weight, caching, fonts) and F10V (video part → P7-01 + SUPP-08, B8 R3.2).
